# Fly.io — copy this file to the repo root (cp deploy/fly.toml fly.toml), then follow DEPLOY.md.
app = "rconsole-CHANGE-ME"          # must be globally unique
primary_region = "sin"              # pick the region nearest your users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  RCONSOLE_DATA_DIR = "/data"
  RCONSOLE_TRUST_PROXY = "1"
  RCONSOLE_COOKIE_SECURE = "1"

[mounts]
  source = "rconsole_data"          # fly volumes create rconsole_data --size 3
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"        # a stopped machine would kill open terminals
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
