# Quick start that PULLS the published image (no source checkout or build needed).
# This is the `docker-compose.yml` attached to each GitHub release.
#
#   cp env.example .env && nano .env       # RCONSOLE_DOMAIN + RCONSOLE_ADMIN_PASSWORD
#   docker compose up -d
#
# Needs the Caddyfile and env.example from the same release, in this folder
# (`cp env.example .env`).
services:
  rconsole:
    image: ghcr.io/salehin-07/rconsole-ark:${RCONSOLE_VERSION:-latest}
    restart: unless-stopped
    environment:
      RCONSOLE_DATA_DIR: /data
      RCONSOLE_ADMIN_PASSWORD: ${RCONSOLE_ADMIN_PASSWORD:?set RCONSOLE_ADMIN_PASSWORD in .env}
      RCONSOLE_TRUST_PROXY: "1"
      RCONSOLE_COOKIE_SECURE: "1"
      RCONSOLE_ALLOWED_ORIGINS: ${RCONSOLE_DOMAIN:?set RCONSOLE_DOMAIN in .env}
    volumes:
      - rconsole-data:/data
    expose:
      - "5000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - rconsole
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RCONSOLE_DOMAIN: ${RCONSOLE_DOMAIN:?set RCONSOLE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rconsole-data:
  caddy-data:
  caddy-config:
