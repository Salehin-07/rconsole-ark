name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --frozen --python 3.14

      # proot + a static busybox enable the real-VM end-to-end tests; without
      # them those tests skip and the rest still run.
      - name: Install VM test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends proot busybox-static

      - name: Lint
        run: uv run ruff check .

      # Browser-behaviour checks for the console UI (system picker keeps focus,
      # phone settings menu, ✕ window button) in a simulated DOM.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI checks (jsdom)
        run: |
          cd tests/js
          npm install --no-save jsdom
          node ui_check.js

      - name: Test
        run: uv run python -m unittest discover -s tests -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rconsole:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts on a root-owned volume and answers the health check
        run: |
          mkdir -p "$RUNNER_TEMP/data"          # not owned by uid 10001
          docker run -d --name rc -p 5000:5000 -v "$RUNNER_TEMP/data:/data" rconsole:ci
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5000/healthz; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ]
          # `docker exec` runs as the image default (root), so inspect the real
          # server process instead: it must have dropped to uid 10001 ...
          docker exec rc ps -eo uid,args | grep -E '^ *10001 .*gunicorn'
          # ... and the entrypoint must have made the mounted volume its own.
          test "$(docker exec rc stat -c %u /data)" = 10001
      - name: Compose file is valid
        run: RCONSOLE_DOMAIN=x.example.com RCONSOLE_ADMIN_PASSWORD=dummydummy docker compose -f deploy/docker-compose.yml config -q
      - name: Logs on failure
        if: failure()
        run: docker logs rc
