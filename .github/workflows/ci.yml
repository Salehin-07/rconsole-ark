name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --frozen --python 3.14

      # proot + a static busybox enable the real-VM end-to-end tests; without
      # them those tests skip and the rest still run.
      - name: Install VM test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends proot busybox-static

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m unittest discover -s tests -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rconsole:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers the health check
        run: |
          docker run -d --name rc -p 5000:5000 rconsole:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/healthz && exit 0
            sleep 1
          done
          docker logs rc
          exit 1
