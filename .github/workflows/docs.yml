name: Docs

# Builds the documentation website from the repository's Markdown and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "docs/**"
      - "scripts/build_docs.py"
      - "scripts/envvars.py"
      - "static/logo.png"
      - "version.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check generated tables are current
        run: uv run --no-project --with markdown==3.7 python scripts/build_docs.py --check
      - name: Build the site (fails on a broken link)
        run: uv run --no-project --with markdown==3.7 python scripts/build_docs.py --site site --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
