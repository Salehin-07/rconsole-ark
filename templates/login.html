<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>rconsole — login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="rconsole">
</head>
<body class="login-body">
  <div class="login-box">
    <img class="login-logo" src="/static/logo.png" alt="rconsole" width="132" height="132">
    <p class="login-sub">simulated linux console — sign in</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      <label>Username</label>
      <input name="username" value="" autofocus required>
      <label>Password</label>
      <input name="password" type="password" required>
      <button type="submit">LOGIN</button>
    </form>
    <!--<p class="login-hint">default credentials — user: <b>ark</b> &nbsp; pass: <b>ark</b></p> -->
  </div>
</body>
</html>
