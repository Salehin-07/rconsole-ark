<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>rconsole — {{ username }}@rconsole</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=cache_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='xterm.css', v=cache_v) }}">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="rconsole">
</head>
<body>
  <div id="app">
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="newtab" title="new tab">+</button>
      <select id="targetsel" title="Where commands run: host or one of your systems" aria-label="Target system" hidden></select>
      <button id="filesbtn" type="button" title="File navigator">📁</button>
      <button id="themebtn" type="button" title="Cycle console theme">theme</button>
      <button id="settingsbtn" type="button" title="Settings: theme and system" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settingsmenu">⚙</button>
    </div>
    <!-- Phones: the theme button and the system dropdown move in here (see
         placeControls() in console.js); wider screens keep them in the tab bar. -->
    <div id="settingsmenu" hidden>
      <div class="sm-title">Settings</div>
      <div class="sm-row"><span class="sm-label">Theme</span><span id="sm-theme-slot"></span></div>
      <div class="sm-row" id="sm-target-row"><span class="sm-label">System</span><span id="sm-target-slot"></span></div>
    </div>
    <div id="screen">
      <div id="output"></div>
      <form id="promptform" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div id="promptline">
          <span id="prompt"></span>
          <input id="cmd" type="text" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" inputmode="text" autofocus>
        </div>
      </form>
    </div>
    <div id="terms"></div>
    <div id="files" hidden>
      <div id="files-bar">
        <span id="files-crumb" title="current directory"></span>
        <span class="editor-spacer"></span>
        <button id="files-up" type="button" title="Up one directory">⬆</button>
        <button id="files-newfile" type="button" title="New file">＋📄</button>
        <button id="files-newdir" type="button" title="New folder">＋📁</button>
        <button id="files-reload" type="button" title="Refresh">⟳</button>
        <button id="files-close" type="button" title="Close">×</button>
      </div>
      <form id="files-goto" autocomplete="off">
        <input id="files-path" type="text" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false" placeholder="/absolute/path or ~/…">
        <button id="files-go" type="submit" title="Go to path">Go</button>
      </form>
      <div id="files-xfer">
        <button id="files-upfiles" type="button" title="Upload files into this folder">⬆ Upload files</button>
        <button id="files-upfolder" type="button" title="Upload a whole folder (keeps its structure)">⬆ Upload folder</button>
        <input id="files-pick" type="file" multiple hidden>
        <input id="files-pickdir" type="file" multiple webkitdirectory hidden>
      </div>
      <div id="files-list"></div>
      <div id="files-status"></div>
    </div>
    <div id="editor" hidden>
      <div id="editor-bar">
        <span id="editor-file" title="file"></span>
        <span id="editor-lang"></span>
        <span id="editor-status"></span>
        <span class="editor-spacer"></span>
        <button id="editor-find-btn" type="button" title="Find / replace (Ctrl/Cmd+F)">Find</button>
        <button id="editor-save" type="button" title="Save (Ctrl/Cmd+S)">Save</button>
        <button id="editor-close" type="button" title="Close">Close</button>
      </div>
      <div id="editor-find" hidden>
        <div class="ef-row">
          <button id="ef-toggle" type="button" title="Show / hide replace">&#9656;</button>
          <input id="ef-query" type="text" placeholder="Find" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" aria-label="Find">
          <span id="ef-count"></span>
          <button id="ef-case" type="button" title="Match case">Aa</button>
          <button id="ef-word" type="button" title="Whole word">ab</button>
          <button id="ef-regex" type="button" title="Regular expression">.*</button>
          <button id="ef-prev" type="button" title="Previous (Shift+Enter)">&#8593;</button>
          <button id="ef-next" type="button" title="Next (Enter)">&#8595;</button>
          <button id="ef-close" type="button" title="Close (Esc)">&#10005;</button>
        </div>
        <div class="ef-row" id="ef-repl-row" hidden>
          <input id="ef-repl" type="text" placeholder="Replace" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" aria-label="Replace with">
          <button id="ef-replace" type="button">Replace</button>
          <button id="ef-all" type="button">All</button>
        </div>
      </div>
      <div id="editor-body">
        <div id="editor-gutter" aria-hidden="true"></div>
        <div id="editor-scroll">
          <div id="editor-curline" aria-hidden="true"></div>
          <pre id="editor-highlight" aria-hidden="true"><code></code></pre>
          <textarea id="editor-input" spellcheck="false" autocomplete="off"
                    autocorrect="off" autocapitalize="off" wrap="off"></textarea>
        </div>
      </div>
      <div id="editor-keys">
        <button type="button" data-act="tab" title="Indent">&#8677;</button>
        <button type="button" data-act="outdent" title="Outdent">&#8676;</button>
        <button type="button" data-act="undo" title="Undo">&#8630;</button>
        <button type="button" data-act="redo" title="Redo">&#8631;</button>
        <button type="button" data-act="find" title="Find / replace">Find</button>
        <button type="button" data-act="comment" title="Toggle comment">//</button>
        <span id="ek-syms"></span>
      </div>
      <div id="editor-statusbar">
        <button id="es-pos" type="button" title="Go to line (Ctrl/Cmd+G)">Ln 1, Col 1</button>
        <span id="es-lines"></span>
        <span class="editor-spacer"></span>
        <span id="es-fs" title="Editor font size">
          <button id="es-fs-down" type="button" title="Smaller text">A&#8722;</button>
          <span id="es-fs-val">14</span>
          <button id="es-fs-up" type="button" title="Larger text">A+</button>
        </span>
        <button id="es-indent" type="button" title="Indentation used for Tab and Enter (click to change)">Spaces: 4</button>
      </div>
    </div>
    <div id="footer">
      <div id="keybar">
        <div class="kb-group">
          <button type="button" data-key="Tab" title="Tab">Tab</button>
          <button type="button" data-key="Esc" title="Escape">Esc</button>
          <button type="button" data-ctrl="X" title="Ctrl+X (exit / cancel in nano)">^X</button>
          <button type="button" data-ctrl="O" title="Ctrl+O (save in nano)">^O</button>
          <button type="button" data-ctrl="W" title="Ctrl+W (search in nano)">^W</button>
          <button type="button" data-ctrl="K" title="Ctrl+K (cut line)">^K</button>
          <button type="button" data-ctrl="U" title="Ctrl+U (paste)">^U</button>
          <button type="button" data-ctrl="C" title="Ctrl+C (interrupt)">^C</button>
          <button type="button" data-ctrl="G" title="Ctrl+G (help in nano)">^G</button>
        </div>
        <div class="kb-group kb-arrows">
          <button type="button" data-key="ArrowUp" title="Up">&#8593;</button>
          <button type="button" data-key="ArrowDown" title="Down">&#8595;</button>
          <button type="button" data-key="ArrowLeft" title="Left">&#8592;</button>
          <button type="button" data-key="ArrowRight" title="Right">&#8594;</button>
        </div>
      </div>
    </div>
    <div id="agentModal" class="modal hidden">
      <div class="modal-box">
        <div id="agentModalTitle" class="modal-title">Choose a model</div>
        <select id="agentModalSelect" class="modal-select"></select>
        <div class="modal-actions">
          <button id="agentModalSelectBtn" type="button" class="btn">Select</button>
          <button id="agentModalCancelBtn" type="button" class="btn btn-ghost">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script>window.RCONSOLE_USER = "{{ username }}";window.RCONSOLE_THEME = "{{ theme }}";</script>
  <script src="{{ url_for('static', filename='editor-core.js', v=cache_v) }}" defer></script>
  <script src="{{ url_for('static', filename='console.js', v=cache_v) }}" defer></script>
</body>
</html>
