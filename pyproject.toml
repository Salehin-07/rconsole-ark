[project]
name = "rconsole"
version = "0.1.0"
description = "Simulated Linux console in the browser with hosted web apps"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-sock>=0.7.0",
    "gunicorn>=26.2.0",
    "pywinpty>=3.0.5; sys_platform == 'win32'",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Stable, low-noise gate: dead code (unused imports/vars) + runtime
# syntax errors. Style rules (formatting, % vs .format, blind-except in
# resilience paths) are intentionally left to reviewer judgment.
select = ["F", "E9"]
