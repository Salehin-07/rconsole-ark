[project]
name = "rconsole"
version = "1.2.1"
description = "Simulated Linux console in the browser with hosted web apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "cryptography>=43.0.0",
    "flask-sock>=0.7.0",
    "gunicorn>=26.2.0",
    "pywinpty>=3.0.5; sys_platform == 'win32'",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Stable, low-noise gate: dead code (unused imports/vars) + runtime
# syntax errors. Style rules (formatting, % vs .format, blind-except in
# resilience paths) are intentionally left to reviewer judgment.
select = ["F", "E9"]

# Run the suite with:  uv run python -m unittest discover -s tests
# The VM end-to-end tests need `proot` and a static `busybox` (PATH, or the
# RCONSOLE_VM_PROOT / RCONSOLE_TEST_BUSYBOX variables); they skip otherwise.
